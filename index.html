<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherLAB APAC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: rgba(0,0,0,0.09);
    --border-md: rgba(0,0,0,0.14);
    --text-primary: #1a1917;
    --text-secondary: #6b6860;
    --text-tertiary: #a8a49e;
    --accent: #1a1917;
    --green: #3B6D11; --green-bg: #EAF3DE; --green-border: #C0DD97;
    --yellow: #854F0B; --yellow-bg: #FAEEDA; --yellow-border: #FAC775;
    --red: #791F1F; --red-bg: #FCEBEB; --red-border: #F7C1C1;
    --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 16px; height: 16px; }
  .header-title { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
  .header-meta { font-size: 12px; color: var(--text-tertiary); font-family: 'DM Mono', monospace; }

  /* ── Tab nav ── */
  .tab-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 0;
  }
  .tab-btn {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }

  /* ── Main container ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 32px 60px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── Section heading ── */
  .section-heading {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    margin-top: 28px;
  }
  .section-heading:first-child { margin-top: 0; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .card-header {
    padding: 12px 18px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title { font-size: 13px; font-weight: 500; }
  .card-subtitle { font-size: 12px; color: var(--text-secondary); }

  /* ── Avatar ── */
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 500;
    flex-shrink: 0;
  }

  /* ── Badge ── */
  .badge {
    font-size: 11px; font-weight: 500;
    padding: 2px 8px;
    border-radius: 100px;
    display: inline-block;
    white-space: nowrap;
  }
  .badge-tl  { background: #E6F1FB; color: #0C447C; }
  .badge-ret { background: #EAF3DE; color: #27500A; }
  .badge-mfg { background: #FAEEDA; color: #633806; }
  .badge-ins { background: #EEEDFE; color: #3C3489; }
  .badge-pre { background: #FBEAF0; color: #72243E; }
  .badge-neu { background: #F1EFE8; color: #444441; }
  .badge-head { background: var(--accent); color: #fff; }

  /* ── Risk tag ── */
  .risk { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 100px; display: inline-block; }
  .risk-g { background: var(--green-bg); color: var(--green); }
  .risk-y { background: var(--yellow-bg); color: var(--yellow); }
  .risk-r { background: var(--red-bg); color: var(--red); }

  /* ── Table rows ── */
  .tbl-header-row, .tbl-data-row {
    display: grid;
    align-items: center;
    padding: 9px 18px;
    gap: 8px;
  }
  .tbl-header-row {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.02em;
  }
  .tbl-data-row {
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .tbl-data-row:last-child { border-bottom: none; }
  .tbl-data-row.is-head { background: #fafaf8; }
  .tbl-data-row.is-open { opacity: 0.65; }
  .tbl-data-row.is-summary { background: var(--surface2); font-weight: 500; }

  /* Org table columns */
  .org-cols { grid-template-columns: 36px 1fr 100px 130px 130px 110px; }

  /* Pipeline table columns */
  .pipe-cols { grid-template-columns: 160px 130px 130px 130px 1fr 90px; }

  /* Regional table columns */
  .regional-cols { grid-template-columns: 140px repeat(6, 1fr); }

  /* ── Num ── */
  .num { font-family: 'DM Mono', monospace; font-size: 12px; }
  .muted { color: var(--text-tertiary); }
  .text-green { color: var(--green); }
  .text-yellow { color: var(--yellow); }
  .text-red { color: var(--red); }

  /* ── Progress bar ── */
  .prog-wrap { display: flex; flex-direction: column; gap: 3px; }
  .prog-label { font-family: 'DM Mono', monospace; font-size: 12px; }
  .prog-bar { height: 3px; background: var(--border-md); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .fill-g { background: #639922; }
  .fill-y { background: #EF9F27; }
  .fill-r { background: #E24B4A; }

  /* ── Metric cards ── */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .metric-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .metric-val { font-size: 24px; font-weight: 500; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }
  .metric-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

  /* ── Activity board ── */
  .act-region { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .act-region-header {
    padding: 11px 18px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .act-region-title { font-size: 13px; font-weight: 500; }
  .act-region-sub { font-size: 12px; color: var(--text-secondary); }
  .act-cols { display: grid; grid-template-columns: repeat(4, 1fr); }
  .act-col-header {
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    padding: 8px 14px;
    background: #fafaf8;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .act-col-header:not(:last-child) { border-right: 1px solid var(--border); }
  .act-cell {
    padding: 12px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 70px;
    line-height: 1.6;
    vertical-align: top;
  }
  .act-cell:not(:last-child) { border-right: 1px solid var(--border); }
  .act-item { display: flex; gap: 7px; margin-bottom: 7px; align-items: flex-start; }
  .act-item:last-child { margin-bottom: 0; }
  .act-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .dot-r { background: #E24B4A; }
  .dot-y { background: #EF9F27; }
  .dot-g { background: #639922; }
  .act-item-body { flex: 1; }
  .act-item-text { color: var(--text-primary); font-size: 12px; line-height: 1.5; }
  .act-item-sub { color: var(--text-tertiary); font-size: 11px; margin-top: 1px; }
  .act-hr { padding: 8px 14px; font-size: 12px; color: var(--text-secondary); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
  .act-hr-label { font-size: 11px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .act-empty { color: var(--text-tertiary); font-style: italic; }

  /* ── Legend ── */
  .legend { display: flex; gap: 18px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── Footer ── */
  .footnote { font-size: 11px; color: var(--text-tertiary); margin-top: 20px; text-align: right; font-family: 'DM Mono', monospace; }

  /* ── Two-col grid for small regions ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .two-col .card { margin-bottom: 0; }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .header { padding: 0 16px; }
    .tab-nav { padding: 0 16px; overflow-x: auto; }
    .two-col { grid-template-columns: 1fr; }
    .org-cols { grid-template-columns: 32px 1fr 90px; }
    .org-col-coverage, .org-col-target, .org-col-pay { display: none; }
    .pipe-cols { grid-template-columns: 130px 1fr 80px; }
    .pipe-col-coverage, .pipe-col-pipeline, .pipe-col-ratio { display: none; }
    .regional-cols { grid-template-columns: 120px repeat(3, 1fr); }
    .act-cols { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="5" height="5" rx="1" fill="white"/>
        <rect x="9" y="2" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
        <rect x="2" y="9" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
        <rect x="9" y="9" width="5" height="5" rx="1" fill="white" opacity="0.3"/>
      </svg>
    </div>
    <span class="header-title">CipherLAB APAC Dashboard</span>
  </div>
  <span class="header-meta" id="last-updated-header">—</span>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showPage(0)">Org Chart</button>
  <button class="tab-btn" onclick="showPage(1)">Performance</button>
  <button class="tab-btn" onclick="showPage(2)">Activity Board</button>
</nav>

<div class="container">

  <!-- ══ PAGE 1: ORG CHART ══ -->
  <div class="page active" id="page0">
    <div id="org-content"></div>
    <p class="footnote" id="org-footnote"></p>
  </div>

  <!-- ══ PAGE 2: PERFORMANCE ══ -->
  <div class="page" id="page1">
    <div id="perf-content"></div>
  </div>

  <!-- ══ PAGE 3: ACTIVITY BOARD ══ -->
  <div class="page" id="page2">
    <div id="activity-content"></div>
    <div class="legend">
      <span style="font-size:12px;color:var(--text-secondary);">Legend:</span>
      <span class="legend-item"><span class="legend-dot dot-r"></span>緊急 / 需立即處理</span>
      <span class="legend-item"><span class="legend-dot dot-y"></span>進行中 / 待確認</span>
      <span class="legend-item"><span class="legend-dot dot-g"></span>正常 / 已完成</span>
    </div>
    <p class="footnote">請將每次 APAC 例會紀錄貼給 Claude，即可取得 data.json 更新內容</p>
  </div>

</div>

<script>
// ── Utilities ──
const fmt = (n) => n == null ? '—' : '$' + Number(n).toLocaleString();
const fmtPct = (n) => n == null ? '—' : (n * 100).toFixed(1) + '%';
const fmtNTD = (n) => n == null ? '—' : 'NTD ' + Number(n).toLocaleString();

function coverageRatio(pipeRev, gpTarget, gpRate) {
  if (!pipeRev || !gpTarget || !gpRate) return null;
  return (pipeRev * gpRate) / gpTarget;
}

function riskLevel(ratio) {
  if (ratio == null) return null;
  if (ratio >= 1.0) return 'g';
  if (ratio >= 0.6) return 'y';
  return 'r';
}

function riskLabel(ratio) {
  if (ratio == null) return '—';
  if (ratio >= 1.0) return 'Green';
  if (ratio >= 0.6) return 'Watch';
  return 'High Risk';
}

function progClass(ratio) {
  if (ratio == null) return 'fill-g';
  if (ratio >= 1.0) return 'fill-g';
  if (ratio >= 0.6) return 'fill-y';
  return 'fill-r';
}

function progWidth(ratio) {
  if (ratio == null) return 0;
  return Math.min(ratio * 100, 100);
}

function coverageTypeClass(type) {
  const map = { tl: 'badge-tl', ret: 'badge-ret', mfg: 'badge-mfg', ins: 'badge-ins', pre: 'badge-pre' };
  return map[type] || 'badge-neu';
}

// ── Page switch ──
function showPage(i) {
  document.querySelectorAll('.page').forEach((p, j) => p.classList.toggle('active', i === j));
  document.querySelectorAll('.tab-btn').forEach((t, j) => t.classList.toggle('active', i === j));
}

// ── Render activity items ──
function renderItems(items) {
  if (!items || items.length === 0) return '<span class="act-empty">—</span>';
  return items.map(item => `
    <div class="act-item">
      <span class="act-dot dot-${item.level || 'g'}"></span>
      <div class="act-item-body">
        <div class="act-item-text">${item.text}</div>
        ${item.sub ? `<div class="act-item-sub">${item.sub}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Build Org Chart ──
function buildOrg(data) {
  const gpRate = data.meta.gp_rate;
  let html = '';

  // TW+HK full table
  const tw = data.regions[0];
  const twGpTarget = tw.performance.annual_gp_target;

  html += `
    <div class="section-heading">Regional Teams</div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">${tw.name}</span>
        <span class="card-subtitle">Regional Head: ${tw.head}</span>
      </div>
      <div class="tbl-header-row org-cols">
        <div></div>
        <div>Name</div>
        <div class="org-col-coverage">Coverage</div>
        <div class="org-col-target">Annual GP Target</div>
        <div class="org-col-pay">Monthly Base (NTD)</div>
        <div>Status</div>
      </div>
      <!-- Head row -->
      <div class="tbl-data-row org-cols is-head">
        <div class="avatar" style="background:${tw.head_color};color:${tw.head_text};">${tw.head_initials}</div>
        <div style="font-weight:500;">${tw.head} <span class="badge badge-head" style="margin-left:6px;">Head</span></div>
        <div class="org-col-coverage muted" style="font-size:12px;">TW + HK All</div>
        <div class="org-col-target num">${fmt(twGpTarget)}</div>
        <div class="org-col-pay num muted">${fmtNTD(tw.head_monthly_base_ntd)}</div>
        <div><span class="badge badge-neu">Active</span></div>
      </div>
  `;

  tw.members.forEach(m => {
    const isOpen = m.status === 'open';
    html += `
      <div class="tbl-data-row org-cols ${isOpen ? 'is-open' : ''}">
        <div class="avatar" style="background:${isOpen ? '#F1EFE8' : tw.head_color};color:${isOpen ? '#5F5E5A' : tw.head_text};">${m.initials}</div>
        <div ${isOpen ? 'style="font-style:italic;color:var(--text-tertiary);"' : ''}>${m.name}</div>
        <div class="org-col-coverage"><span class="badge ${coverageTypeClass(m.coverage_type)}">${m.coverage}</span></div>
        <div class="org-col-target num ${isOpen ? 'muted' : ''}">${fmt(m.gp_target_usd)}</div>
        <div class="org-col-pay num muted">${fmtNTD(m.monthly_base_ntd)}</div>
        <div>${isOpen ? '<span class="badge" style="background:#FCEBEB;color:#791F1F;">Open</span>' : `<span class="badge badge-neu">${m.role}</span>`}</div>
      </div>
    `;
  });

  html += `</div>`; // end card

  // Other regions 2-col
  html += `<div class="two-col">`;
  data.regions.slice(1).forEach(r => {
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-title">${r.name}</span>
          <span class="card-subtitle">Head: ${r.head}</span>
        </div>
        <div class="tbl-header-row" style="grid-template-columns:36px 1fr 110px;">
          <div></div><div>Name</div><div>GP Target</div>
        </div>
        <div class="tbl-data-row is-head" style="grid-template-columns:36px 1fr 110px;">
          <div class="avatar" style="background:${r.head_color};color:${r.head_text};">${r.head_initials}</div>
          <div style="font-weight:500;">${r.head}</div>
          <div class="num muted">${fmt(r.performance.annual_gp_target)}</div>
        </div>
        ${r.members.map(m => `
          <div class="tbl-data-row" style="grid-template-columns:36px 1fr 110px;">
            <div class="avatar" style="background:${r.head_color};color:${r.head_text};opacity:0.7;">${m.initials}</div>
            <div>${m.name}</div>
            <div class="num muted">${fmt(m.gp_target_usd)}</div>
          </div>
        `).join('')}
      </div>
    `;
  });
  html += `</div>`;

  document.getElementById('org-content').innerHTML = html;
  document.getElementById('org-footnote').textContent = '* Annual GP Target in USD  ·  Monthly Base in NTD  ·  其他區域數據待補充';
}

// ── Build Performance ──
function buildPerf(data) {
  const gpRate = data.meta.gp_rate;
  const tw = data.regions[0];
  const twGpTarget = tw.performance.annual_gp_target;

  // Calc TW total pipeline from members
  const twPipeTotal = tw.members.reduce((s, m) => s + (m.pipeline_rev_usd || 0), 0);
  const twGpFromPipe = twPipeTotal * gpRate;
  const twCoverage = twGpTarget ? twGpFromPipe / twGpTarget : null;

  let html = `
    <div class="section-heading">Taiwan + Hong Kong — 2026 Overview</div>
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label">TW 年度 GP 目標</div>
        <div class="metric-val">${fmt(twGpTarget)}</div>
        <div class="metric-sub">USD / 全團隊合計</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">TW Total Pipeline (Rev)</div>
        <div class="metric-val ${twCoverage && twCoverage < 0.6 ? 'text-red' : twCoverage && twCoverage < 1 ? 'text-yellow' : 'text-green'}">${fmt(twPipeTotal)}</div>
        <div class="metric-sub">所有 AE 合計</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">GP Rate (預估)</div>
        <div class="metric-val text-yellow">${fmtPct(gpRate)}</div>
        <div class="metric-sub">目標 27%，缺口 1.3pp</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Pipeline 預估 GP Coverage</div>
        <div class="metric-val ${twCoverage && twCoverage < 0.6 ? 'text-red' : twCoverage && twCoverage < 1 ? 'text-yellow' : 'text-green'}">${twCoverage != null ? Math.round(twCoverage * 100) + '%' : '—'}</div>
        <div class="metric-sub">Pipeline Rev × GP Rate ÷ GP Target</div>
      </div>
    </div>

    <div class="section-heading">各業務 Pipeline vs GP Target</div>
    <div class="card">
      <div class="tbl-header-row pipe-cols">
        <div>業務</div>
        <div class="pipe-col-coverage">GP Target (USD)</div>
        <div class="pipe-col-pipeline">Pipeline Rev (USD)</div>
        <div>GP Coverage</div>
        <div class="pipe-col-ratio">Progress</div>
        <div>Risk</div>
      </div>
      <!-- TW summary row -->
      <div class="tbl-data-row pipe-cols is-summary">
        <div>Terrence (TW All)</div>
        <div class="pipe-col-coverage num">${fmt(twGpTarget)}</div>
        <div class="pipe-col-pipeline num">${fmt(twPipeTotal)}</div>
        <div class="prog-wrap">
          <span class="prog-label ${twCoverage && twCoverage < 0.6 ? 'text-red' : twCoverage && twCoverage < 1 ? 'text-yellow' : 'text-green'}">${twCoverage != null ? Math.round(twCoverage * 100) + '%' : '—'}</span>
          <div class="prog-bar"><div class="prog-fill ${progClass(twCoverage)}" style="width:${progWidth(twCoverage)}%"></div></div>
        </div>
        <div class="pipe-col-ratio"></div>
        <div><span class="risk risk-${riskLevel(twCoverage) || 'g'}">${riskLabel(twCoverage)}</span></div>
      </div>
  `;

  // Per AE rows (only those with gp_target)
  tw.members.filter(m => m.gp_target_usd).forEach(m => {
    const ratio = coverageRatio(m.pipeline_rev_usd, m.gp_target_usd, gpRate);
    const rl = riskLevel(ratio);
    html += `
      <div class="tbl-data-row pipe-cols ${m.status === 'open' ? 'is-open' : ''}">
        <div>${m.status === 'open' ? '<em>' + m.name + ' (Open)</em>' : m.name}</div>
        <div class="pipe-col-coverage num">${fmt(m.gp_target_usd)}</div>
        <div class="pipe-col-pipeline num">${fmt(m.pipeline_rev_usd)}</div>
        <div class="prog-wrap">
          <span class="prog-label ${rl === 'g' ? 'text-green' : rl === 'y' ? 'text-yellow' : 'text-red'}">${ratio != null ? Math.round(ratio * 100) + '%' : '—'}</span>
          <div class="prog-bar"><div class="prog-fill ${progClass(ratio)}" style="width:${progWidth(ratio)}%"></div></div>
        </div>
        <div class="pipe-col-ratio"></div>
        <div><span class="risk risk-${rl || 'g'}">${riskLabel(ratio)}</span></div>
      </div>
    `;
  });

  html += `</div>`; // end pipeline card

  // Regional table
  html += `
    <div class="section-heading">各區域季度業績狀況</div>
    <div class="card">
      <div class="tbl-header-row regional-cols">
        <div>區域</div>
        <div>Q GP 目標</div>
        <div>Pipeline Rev</div>
        <div>已出貨</div>
        <div>待出貨</div>
        <div>預估 GM%</div>
        <div>上月實際 GM%</div>
      </div>
  `;

  data.regions.forEach(r => {
    const qGP = r.performance.annual_gp_target ? Math.round(r.performance.annual_gp_target / 4) : null;
    const rPipe = r.members.reduce((s, m) => s + (m.pipeline_rev_usd || 0), 0) || null;
    html += `
      <div class="tbl-data-row regional-cols ${r.id === 'tw_hk' ? 'is-summary' : ''}">
        <div>${r.name} <span style="color:var(--text-tertiary);font-size:11px;">${r.head}</span></div>
        <div class="num">${fmt(qGP)}</div>
        <div class="num">${rPipe ? fmt(rPipe) : '<span class="muted">待補充</span>'}</div>
        <div class="num muted">${fmt(r.performance.q_shipped)}</div>
        <div class="num muted">${fmt(r.performance.q_pending)}</div>
        <div class="${r.performance.gm_estimated ? 'text-yellow' : 'muted'}">${fmtPct(r.performance.gm_estimated)}</div>
        <div class="muted">${fmtPct(r.performance.gm_last_month)}</div>
      </div>
    `;
  });

  html += `</div>`;
  html += `<p class="footnote">* GP Coverage = Pipeline Rev × GP Rate (${fmtPct(gpRate)}) ÷ GP Target  ·  Q GP Target = Annual ÷ 4</p>`;

  document.getElementById('perf-content').innerHTML = html;
}

// ── Build Activity Board ──
function buildActivity(data) {
  let html = '';
  data.regions.forEach(r => {
    const act = r.activity;
    const hasContent =
      (act.presales && act.presales.length > 0) ||
      (act.factory && act.factory.length > 0) ||
      (act.pm_rd && act.pm_rd.length > 0) ||
      (act.marketing && act.marketing.length > 0);

    html += `
      <div class="act-region">
        <div class="act-region-header">
          <div>
            <span class="act-region-title">${r.name}</span>
            <span class="act-region-sub" style="margin-left:10px;">${r.head}</span>
          </div>
          <span class="risk ${hasContent ? 'risk-g' : 'risk-g'}" style="opacity:${hasContent ? 1 : 0.4};">Active</span>
        </div>
        <div class="act-cols">
          <div class="act-col-header">Pre-Sales / Testing</div>
          <div class="act-col-header">Sales Admin / Factory</div>
          <div class="act-col-header">PM / RD</div>
          <div class="act-col-header">Marketing</div>
          <div class="act-cell">${renderItems(act.presales)}</div>
          <div class="act-cell">${renderItems(act.factory)}</div>
          <div class="act-cell">${renderItems(act.pm_rd)}</div>
          <div class="act-cell">${renderItems(act.marketing)}</div>
        </div>
        <div class="act-hr">
          <span class="act-hr-label">HR</span>
          <span>${act.hr || '<span class="act-empty">—</span>'}</span>
        </div>
      </div>
    `;
  });

  document.getElementById('activity-content').innerHTML = html;
}

// ── Main: load data.json and render ──
async function init() {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error('Cannot load data.json');
    const data = await res.json();

    // Header date
    document.getElementById('last-updated-header').textContent = 'Updated: ' + data.meta.last_updated;

    buildOrg(data);
    buildPerf(data);
    buildActivity(data);
  } catch (e) {
    document.querySelector('.container').innerHTML = `
      <div style="padding:40px;text-align:center;color:#791F1F;">
        <p style="font-size:15px;font-weight:500;">無法載入 data.json</p>
        <p style="font-size:13px;margin-top:8px;color:#a8a49e;">請確認 data.json 與 index.html 在同一個資料夾中</p>
        <p style="font-size:12px;margin-top:4px;color:#a8a49e;font-family:monospace;">${e.message}</p>
      </div>
    `;
  }
}

init();
</script>
</body>
</html>
